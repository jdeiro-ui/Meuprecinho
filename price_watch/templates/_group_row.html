{% from "_icons.html" import icon %}
<article class="card item {{ 'on' if g.monitored }}" id="g{{ g.id }}">
  <span class="avatar">{{ g.title[:1]|upper }}</span>
  <div class="grow">
    <strong>{{ g.title }}</strong>
    <small>{{ {'group': 'Grupo', 'supergroup': 'Supergrupo', 'channel': 'Canal'}[g.kind] }}{% if g.username %} · @{{ g.username }}{% endif %}</small>
  </div>
  <button class="switch {{ 'on' if g.monitored }}" role="switch" aria-checked="{{ 'true' if g.monitored else 'false' }}"
          hx-post="/groups/{{ g.id }}/toggle" hx-target="#g{{ g.id }}" hx-swap="outerHTML"
          aria-label="Monitorar {{ g.title }}"></button>
</article>
