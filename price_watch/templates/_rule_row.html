{% from "_icons.html" import icon %}
<article class="card item {{ '' if r.active else 'muted' }}" id="r{{ r.id }}">
  <a class="grow" href="/rules/{{ r.id }}">
    <strong class="kw">{{ r.keyword }}</strong>
    <div class="chips">
      {% if r.groups %}{% for g in r.groups %}<span class="chip">{{ g.title }}</span>{% endfor %}
      {% else %}<span class="chip">todos os grupos</span>{% endif %}
      {% for e in r.exclusions.split(', ') if e %}<span class="chip neg">sem {{ e }}</span>{% endfor %}
    </div>
  </a>
  <button class="switch {{ 'on' if r.active }}" role="switch" aria-checked="{{ 'true' if r.active else 'false' }}"
          hx-post="/rules/{{ r.id }}/toggle" hx-target="#r{{ r.id }}" hx-swap="outerHTML"
          aria-label="Ativar regra {{ r.keyword }}"></button>
  <button class="icon-btn danger" hx-post="/rules/{{ r.id }}/delete" hx-target="#r{{ r.id }}"
          hx-swap="outerHTML" hx-confirm="Remover a regra?" aria-label="Remover regra">{{ icon('x', 18) }}</button>
</article>
